apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: container-lab
  namespace: argocd
spec:
  description: Docker kind integration-test platform
  sourceRepos:
    - git://container-lab-git.git.svc.cluster.local:9418/repo.git
    - https://prometheus-community.github.io/helm-charts
    - https://cloudnative-pg.github.io/charts
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
