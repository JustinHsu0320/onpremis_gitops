---
- name: Return the cluster access contract to the Mac
  hosts: control_plane
  become: true
  tasks:
    - name: Ensure local artifact directory exists
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../artifacts"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: Fetch admin kubeconfig for the lab
      ansible.builtin.fetch:
        src: /etc/kubernetes/admin.conf
        dest: "{{ playbook_dir }}/../../artifacts/kubeconfig"
        flat: true
      no_log: true

    - name: Protect the local kubeconfig
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../artifacts/kubeconfig"
        mode: "0600"
      delegate_to: localhost
      become: false

