---
- name: Disable swap now
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb | int > 0
  changed_when: true

- name: Disable swap after reboot
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(\s*[^#]\S+\s+\S+\s+swap\s+.*)$'
    replace: '# \1'

- name: Load kernel modules at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/kubernetes.conf
    mode: "0644"
    content: |
      overlay
      br_netfilter
  notify: Load Kubernetes kernel modules

- name: Apply Kubernetes network sysctl settings
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes-cri.conf
    mode: "0644"
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
  notify: Reload sysctl

- name: Install node prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gpg
      - chrony
      - open-iscsi
      - nfs-common
      - socat
      - conntrack
    state: present
    update_cache: true

- name: Keep time synchronization online
  ansible.builtin.systemd_service:
    name: chrony
    enabled: true
    state: started

- name: Disable UFW only for this private lab
  ansible.builtin.systemd_service:
    name: ufw
    enabled: false
    state: stopped
  when: lab_disable_ufw | bool
  failed_when: false

- name: Flush baseline handlers before installing the runtime
  ansible.builtin.meta: flush_handlers

