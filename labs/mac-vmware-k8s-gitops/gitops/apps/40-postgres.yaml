apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-postgres
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: mac-vmware-lab
  source:
    repoURL: https://gitlab.example.com/platform/onpremis_gitops.git
    targetRevision: main
    path: labs/mac-vmware-k8s-gitops/k8s/data/postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

