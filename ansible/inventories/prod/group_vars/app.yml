---
# =============================================================================
# group_vars/app.yml — 應用層（api / worker / smtp-receiver + 同居 KeyDB）
# =============================================================================

# ---------- PKI ----------
# keydb-server 用 peer profile：KeyDB cluster bus 是「彼此互連」的雙向 TLS，
# 每個節點同時是 server（被連）也是 client（去連別人），EKU 必須兩者都有
pki_certificates:
  - name: keydb-server
    profile: peer
    owner: root
    group: root
    key_mode: "0640"
    extra_sans: ["IP:127.0.0.1"]   # app 走 localhost 連本機 KeyDB，SAN 要涵蓋
  - name: keydb-client
    profile: client
    owner: root
    group: root
    key_mode: "0640"

# ---------- NFS 掛載（規劃書 §7.4：修正「附件寫本機碟」的最大痛點） ----------
# 注意：NFSv4 的掛載路徑相對於伺服器的 pseudo-root（fsid=0 = /export），
# 所以這裡是 /mail-proxy/attachments 而非伺服器端實體路徑 /export/mail-proxy/attachments
nfs_mounts:
  - path: "{{ attachments_mount }}"
    src: "nfs-01.{{ domain }}:{{ nfs_attachments_v4path }}"
