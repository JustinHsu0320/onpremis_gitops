---
# =============================================================================
# group_vars/lb.yml — 邊界層（HAProxy + Keepalived + Squid egress 同居）
# =============================================================================

# haproxy role 是「一份 role、多種面孔」：以 profile 選擇組態模板（CONVENTIONS.md §8）
haproxy_profile: edge

# ---------- PKI：各專案 edge 憑證（組裝式，CONVENTIONS §10） ----------
# 邊界的 TLS 終止憑證不再寫死：每個宣告 edge 段的專案帶自己的 cert
# （bundle_pem=true → pki_leaf 產出 <name>.pem = crt+chain+key 串接，
# HAProxy 的 crt 參數吃這種格式）。email_proxy 的 svc-api 憑證宣告見
# project_email_proxy.yml。平台自身在 lb 上沒有憑證需求 → 基底空清單。
pki_certificates: >-
  {{ projects | dict2items | sort(attribute='key')
     | selectattr('value.edge', 'defined')
     | map(attribute='value.edge.cert') | list }}

# ---------- Keepalived：一台主機一份設定檔，所有 VRRP instance 集中定義 ----------
# vrid 配置表（CONVENTIONS §7，全網段內不可重複）：VI_SVC=10 / VI_EGRESS=12 /
# VI_KONG=20 / VI_PG=30 / VI_MQ=31 / VI_S3=40
keepalived_instances:
  - name: VI_SVC
    vrid: 10
    vip: "{{ service_vip }}"
    state: "{{ keepalived_state }}"          # host_vars：lb-01=MASTER / lb-02=BACKUP
    priority: "{{ keepalived_priority }}"    # host_vars：150 / 100
    auth_pass: "{{ vrrp_pass_svc }}"
    peers_group: lb                          # 單播 VRRP 的對象群組（ADR-7）
    track_haproxy: true                      # HAProxy 死掉 → priority -60 → VIP 漂移
  - name: VI_EGRESS
    vrid: 12
    vip: "{{ egress_vip }}"
    state: "{{ keepalived_state }}"
    priority: "{{ keepalived_priority }}"
    auth_pass: "{{ vrrp_pass_egress }}"
    peers_group: lb
    track_haproxy: false                     # egress VIP 跟著 Squid，不跟 HAProxy
    track_squid: true
