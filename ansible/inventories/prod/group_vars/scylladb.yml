---
# =============================================================================
# group_vars/scylladb.yml — ScyllaDB 寬欄資料層
# =============================================================================

# ---------- PKI ----------
# scylla-server 用 peer profile：節點間 7001 是「彼此互連」的雙向 TLS
# （require_client_auth: true），每個節點同時是 server 也是 client，
# EKU 必須兩者都有；同一張憑證也服務 9042 的客戶端 TLS（serverAuth）。
# extra_sans 加 127.0.0.1：本機迴環除錯（cqlsh localhost）也能過憑證驗證。
pki_certificates:
  - name: scylla-server
    profile: peer
    owner: root
    group: root
    key_mode: "0640"
    extra_sans: ["IP:127.0.0.1"]

# ---------- 資料碟（05-block-storage） ----------
# Scylla 的 data/commitlog 全在獨立 XFS 碟（Scylla 官方唯一完整支援的 FS；
# MIS 用 ext4 靠 developer mode 遮檢查，本環境修正）。
# owner 不在這裡指定：容器內 UID 999 不是宿主帳號，掛載點由 scylla role 建子目錄時 chown。
# 500GB 依 MIS 現況（每節點 ~50GB、三個月）預留成長空間——LSM 壓實需要
# 可觀的暫存餘裕，磁碟用量常態請維持 < 70%（監控 NodeFilesystemAlmostFull）。
storage_volumes:
  - { mountpoint: /var/lib/scylla, size_gb: 500 }

# ---------- 租戶清單（多專案平台的迭代點，CONVENTIONS §10） ----------
# scylla_tenants 從 projects 推導：每個宣告 scylla 段的專案一個租戶
#   { keyspaces: [...], user, password }
# 消費者：roles/scylla/tasks/main.yml §6（app role / keyspace / GRANT 全部
# per-tenant 迴圈）與角色審計白名單。含密碼引用 → 迭代方須 label + no_log。
# email_proxy 的 keyspace 值（set_usc / email_service）沿用 MIS 現況——
# keyspace 無法 rename，且日後以「加 DC」方式從 MIS 線上遷移時值必須一致
# （宣告見 project_email_proxy.yml，此處只推導不定值）。
scylla_tenants: >-
  {{ projects | dict2items | sort(attribute='key')
     | selectattr('value.scylla', 'defined')
     | map(attribute='value.scylla') | list }}
