---
# =============================================================================
# group_vars/rabbitmq.yml — 訊息佇列層（RabbitMQ 4.x quorum queue）
# =============================================================================

# ---------- 租戶清單（多專案平台的迭代點，CONVENTIONS §10） ----------
# rabbitmq_tenants 從 projects 推導：每個宣告 rabbitmq 段的專案一個租戶
#   { vhost, user, password, dlx_exchange, dlq_queue, queues: [{name, dlx}] }
# 消費者：roles/rabbitmq/tasks/main.yml §10（vhost / user / DLX / queues /
# binding 全部 per-tenant 迴圈）。含密碼引用 → 迭代方須 label + no_log。
rabbitmq_tenants: >-
  {{ projects | dict2items | sort(attribute='key')
     | selectattr('value.rabbitmq', 'defined')
     | map(attribute='value.rabbitmq') | list }}

# ---------- 資料碟（block_storage role；lab 因 is_container 跳過） ----------
# 對應 terraform 的 mq disk1-mqdata（100G）。RabbitMQ 的 mnesia / quorum queue
# 的 Raft log 都寫在這裡，寫不進去 = 佇列服務癱瘓，所以要獨立碟
storage_volumes:
  - { mountpoint: /var/lib/rabbitmq, size_gb: 100, owner: rabbitmq, group: rabbitmq, mode: "0750" }

# 延遲訊息 plugin（email_proxy 的重試機制依賴它；下載走 egress proxy 白名單
# 的 .githubusercontent.com，或先下載後放內部制品庫）
rabbitmq_delayed_plugin_enabled: true

# ---------- PKI ----------
pki_certificates:
  - name: rabbitmq-server
    profile: server
    owner: rabbitmq
    group: rabbitmq
    key_mode: "0600"
    # app 連 rabbitmq-vip:5671，SAN 必須涵蓋 VIP 名稱與 IP
    extra_sans:
      - "DNS:rabbitmq-vip.{{ domain }}"
      - "DNS:rabbitmq-vip"
      - "IP:{{ rabbitmq_vip }}"

# ---------- HAProxy（AMQPS VIP）+ Keepalived ----------
# app 一律經 VIP 5671，不直連個別節點
haproxy_profile: rabbitmq

keepalived_instances:
  - name: VI_MQ
    vrid: 31
    vip: "{{ rabbitmq_vip }}"
    state: "{{ keepalived_state }}"
    priority: "{{ keepalived_priority }}"
    auth_pass: "{{ vrrp_pass_mq }}"
    peers_group: rabbitmq
    track_haproxy: true
