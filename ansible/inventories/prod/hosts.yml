---
# =============================================================================
# inventories/prod/hosts.yml — 主機清單的「唯一事實來源」
#
# 鐵律：機器的增減 / IP 異動，一律先改這份檔案（走 PR），再由 Terraform 開機器、
#       Ansible 設定機器。禁止先動機器再回頭補文件——那就是 config drift 的起點。
#
# 對照 Terraform：terraform/environments/prod/main.tf 的 VM 清單與這裡一一對應，
# 兩邊都以 CONVENTIONS.md §2 的 IP 配置表為準。
#
# 組件選單語意（CONVENTIONS.md §1）：本檔永遠宣告「全部」平台群組；
# 不用的組件把群組留空（hosts: {}），對應 play 自動 skip——不要刪群組
# （群組不存在時模板的 groups['xxx'] 是 undefined key）。
# =============================================================================
all:
  vars:
    # 專用自動化帳號（非個人帳號、非 root）：由 VM template 的 cloud-init 建立，
    # 含 mgmt-01 的公鑰與 sudoers NOPASSWD（見 terraform/modules/vm 的 userdata）
    ansible_user: ansible
    ansible_ssh_private_key_file: ~/.ssh/id_platform

  children:
    # ---------- VLAN 10 邊界層：無狀態，可隨時重建 ----------
    lb:
      hosts:
        lb-01: { ansible_host: 10.20.10.11 }
        lb-02: { ansible_host: 10.20.10.12 }

    # egress 正向代理與 lb 同居（ADR-3：省 2 台 VM，且兩者同為無狀態邊界元件）
    egress:
      hosts:
        lb-01: {}
        lb-02: {}

    # ---------- VLAN 20 應用層 ----------
    # Kong API Gateway（DB-less）：北向由邊界 HAProxy 分流、東西向走 kong VIP .20
    kong:
      hosts:
        kong-01: { ansible_host: 10.20.20.21 }
        kong-02: { ansible_host: 10.20.20.22 }

    # email_proxy 專案的應用節點（api/worker/smtp compose + 同居 KeyDB）。
    # 群組名帶專案名是刻意的：VLAN 20 是「各專案 app 節點」的共用網段，
    # 新專案開自己的 app_<project> 群組並掛入 compose_apps
    app_email_proxy:
      hosts:
        app-01: { ansible_host: 10.20.20.11 }
        app-02: { ansible_host: 10.20.20.12 }
        app-03: { ansible_host: 10.20.20.13 }

    # 全部「VM+Compose 型專案」節點的 parent（50-apps.yml 的 hosts 目標）
    compose_apps:
      children:
        app_email_proxy:

    # KeyDB 與 email_proxy app 同主機（該專案的私有快取，CONVENTIONS §10.6）
    keydb:
      hosts:
        app-01: {}
        app-02: {}
        app-03: {}

    # ---------- VLAN 30 資料層：有狀態，quorum 型叢集 ----------
    postgres:
      hosts:
        pg-01: { ansible_host: 10.20.30.11 }
        pg-02: { ansible_host: 10.20.30.12 }
        pg-03: { ansible_host: 10.20.30.13 }

    # etcd 與 postgres 同主機（Patroni 的 DCS）；獨立成群組是為了
    # 日後要把 etcd 拆到獨立機器時，只改 inventory、不改任何 role
    etcd:
      hosts:
        pg-01: {}
        pg-02: {}
        pg-03: {}

    rabbitmq:
      hosts:
        mq-01: { ansible_host: 10.20.30.21 }
        mq-02: { ansible_host: 10.20.30.22 }
        mq-03: { ansible_host: 10.20.30.23 }

    # ScyllaDB 寬欄資料層（拓撲承襲 MIS scylladb-1..3）
    scylladb:
      hosts:
        scylla-01: { ansible_host: 10.20.30.31 }
        scylla-02: { ansible_host: 10.20.30.32 }
        scylla-03: { ansible_host: 10.20.30.33 }

    # ---------- VLAN 40 儲存層 ----------
    nfs:
      hosts:
        nfs-01: { ansible_host: 10.20.40.11 }

    # SeaweedFS S3 物件儲存（3 節點；filer 元資料庫在 Patroni PG →
    # 依賴 postgres 組件、site.yml 排在 30 之後）。S3 VIP = 10.20.40.10
    seaweedfs:
      hosts:
        sw-01: { ansible_host: 10.20.40.21 }
        sw-02: { ansible_host: 10.20.40.22 }
        sw-03: { ansible_host: 10.20.40.23 }

    # ---------- VLAN 50 DevOps 層（GitLab 自建；lab 實驗室不部署） ----------
    gitlab:
      hosts:
        gitlab-01: { ansible_host: 10.20.50.11 }

    gitlab_runner:
      hosts:
        runner-01: { ansible_host: 10.20.50.12 }

    # ---------- VLAN 99 管理層 ----------
    # mgmt-01 同時是：Ansible 控制節點、Issuing CA 簽發主機、Prometheus/Grafana
    monitoring:
      hosts:
        mgmt-01:
          ansible_host: 10.20.99.11
          # mgmt-01 就是跑 ansible-playbook 的機器自己，走 local 連線
          # （免去「自己 ssh 自己」的金鑰佈建問題）
          ansible_connection: local
