---
# =============================================================================
# inventories/lab/hosts.yml — Docker 實驗室（拓撲與 prod「完全相同」）
#
# 這份檔案與 prod/hosts.yml 的差異只有三處：
#   1. gitlab / gitlab_runner 群組宣告但「留空」（GitLab 需 4GB+ RAM，不進實驗室；
#      空群組 = 組件選單關閉，play 自動 skip——CONVENTIONS §1）
#   2. ansible_ssh_private_key_file 指向 lab 現場產生的金鑰（make lab-up 產生）
#   3. mgmt-01 一樣是 local 連線（實驗室的控制節點就是 mgmt-01 容器本身）
#
# IP 完全沿用 prod 配置——Docker network 直接建成 10.20.x.0/24，
# 「實驗室驗證過的拓撲 = 正式環境的拓撲」是本實驗室存在的意義。
# =============================================================================
all:
  vars:
    ansible_user: ansible
    # {{ inventory_dir }} = ansible/inventories/lab → ../../lab/.ssh = ansible/lab/.ssh
    ansible_ssh_private_key_file: "{{ inventory_dir }}/../../lab/.ssh/id_lab"

  children:
    lb:
      hosts:
        lb-01: { ansible_host: 10.20.10.11 }
        lb-02: { ansible_host: 10.20.10.12 }

    egress:
      hosts:
        lb-01: {}
        lb-02: {}

    kong:
      hosts:
        kong-01: { ansible_host: 10.20.20.21 }
        kong-02: { ansible_host: 10.20.20.22 }

    app_email_proxy:
      hosts:
        app-01: { ansible_host: 10.20.20.11 }
        app-02: { ansible_host: 10.20.20.12 }
        app-03: { ansible_host: 10.20.20.13 }

    compose_apps:
      children:
        app_email_proxy:

    keydb:
      hosts:
        app-01: {}
        app-02: {}
        app-03: {}

    postgres:
      hosts:
        pg-01: { ansible_host: 10.20.30.11 }
        pg-02: { ansible_host: 10.20.30.12 }
        pg-03: { ansible_host: 10.20.30.13 }

    etcd:
      hosts:
        pg-01: {}
        pg-02: {}
        pg-03: {}

    rabbitmq:
      hosts:
        mq-01: { ansible_host: 10.20.30.21 }
        mq-02: { ansible_host: 10.20.30.22 }
        mq-03: { ansible_host: 10.20.30.23 }

    scylladb:
      hosts:
        scylla-01: { ansible_host: 10.20.30.31 }
        scylla-02: { ansible_host: 10.20.30.32 }
        scylla-03: { ansible_host: 10.20.30.33 }

    nfs:
      hosts:
        nfs-01: { ansible_host: 10.20.40.11 }

    seaweedfs:
      hosts:
        sw-01: { ansible_host: 10.20.40.21 }
        sw-02: { ansible_host: 10.20.40.22 }
        sw-03: { ansible_host: 10.20.40.23 }

    # 組件選單：lab 不部署 GitLab（資源），群組宣告但留空
    gitlab:
      hosts: {}

    gitlab_runner:
      hosts: {}

    monitoring:
      hosts:
        mgmt-01:
          ansible_host: 10.20.99.11
          ansible_connection: local
