# =============================================================================
# 50-app.yml — 應用層（api / worker / smtp-receiver）
#
# 前提：PG / MQ / KeyDB / NFS / LB 全部就緒（site.yml 的順序保證）。
# 映像來源（ADR-6）：GitLab CI build → push registry.<domain> → 各節點 pull；
# 實驗室以 app_stack_mock=true 改用本地 build 的極簡模擬器驗證鏈路。
# 滾動更新 serial: 1：配合 LB 健檢（fall 3 × inter 5s）自然摘除/回掛。
# =============================================================================
- name: 佈署 email_proxy 應用堆疊（compose）
  hosts: app
  tags: [app]
  serial: 1
  roles:
    - role: app_stack
