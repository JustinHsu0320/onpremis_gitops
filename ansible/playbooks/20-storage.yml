---
# =============================================================================
# 20-storage.yml — NFS 儲存層
#
# nfs-01 的匯出 = 平台區（PG 備份庫）+ 各專案宣告（projects.*.nfs.exports，
# 例：email_proxy 的附件）。NFSv4.1 + hard mount：NFS 短暫故障時 client IO
# 阻塞等待而非回傳壞資料，配合 vSphere HA（RTO 1-3 分鐘）構成可用性方案。
# =============================================================================
- name: NFS Server（nfs-01）
  hosts: nfs
  tags: [storage, nfs-server]
  roles:
    - role: nfs_server

# 各專案 app 節點的掛載由其群組 group_vars 宣告 nfs_mounts
# （例：group_vars/app_email_proxy.yml 掛附件；成對契約見該檔註解）
- name: 專案 app 節點掛載共享目錄
  hosts: compose_apps
  tags: [storage, nfs-client]
  roles:
    - role: nfs_client

# NFSv4 掛載路徑相對於 pseudo-root（見 group_vars/app_email_proxy.yml 的同款註解）
- name: PG 節點掛載備份庫
  hosts: postgres
  tags: [storage, nfs-client]
  vars:
    nfs_mounts:
      - path: "{{ pgbackup_mount }}"
        src: "nfs-01.{{ domain }}:{{ nfs_pgbackup_v4path }}"
  roles:
    - role: nfs_client
