---
# =============================================================================
# 32-keydb.yml — KeyDB 快取叢集（規劃書 §7.6：修正「3 master 無副本」）
#
# 每台 app 節點跑 1 master + 1 replica（Docker 容器、host network、TLS-only），
# cluster create --cluster-replicas 1 確保 replica 分配在「別台」的 master 上：
# 任一 app 節點整台故障，其 1/3 slot 由他台 replica 自動 failover 接手。
# =============================================================================
- name: KeyDB 3 master + 3 replica 叢集
  hosts: keydb
  tags: [keydb]
  roles:
    - role: keydb
