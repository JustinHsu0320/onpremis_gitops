---
# =============================================================================
# roles/egress_proxy/defaults/main.yml — Squid 白名單代理可調參數
#
# 跨 role 契約變數（CONVENTIONS.md §7 / group_vars 定義，本檔不重複給預設值）：
#   squid_port（3128）、internal_cidr（10.20.0.0/16）——group_vars/all/vars.yml
#   egress_allowlist（顯式網域白名單，不可為空）——group_vars/egress.yml
# =============================================================================

# access log 落點：combined 格式的稽核軌跡。
# logrotate 由 squid 套件自帶的 /etc/logrotate.d/squid 接手，本 role 不重複管理
egress_proxy_access_log: /var/log/squid/access.log

# squid 崩潰時 core dump 的落點（套件建好的目錄，squid 服務帳號可寫）
egress_proxy_coredump_dir: /var/spool/squid

# 部署自驗：wait_for 監聽埠的等待上限（秒）
egress_proxy_wait_timeout: 30
