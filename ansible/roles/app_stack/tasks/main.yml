---
# =============================================================================
# roles/app_stack/tasks/main.yml — email_proxy 應用堆疊（api/worker/smtp）compose 佈署
#
# 兩種模式（app_stack_mock）：
#   prod（false）：pull registry.{{ domain }} 的三個正式映像（ADR-6）
#   lab （true） ：本地 build 極簡 mock（驗鏈路不驗商業邏輯）——
#                  99-verify 依賴 mock 的 /health 200 與 SMTP 220 banner
#
# 前置依賴（由 site.yml 順序保證）：
#   00-bootstrap：Docker Engine；10-pki：keydb-client 憑證 + ca.crt；
#   20-storage：{{ attachments_mount }} NFS 掛載；30/31/32：資料層；40-lb：LB
# 滾動更新：50-app.yml 用 serial: 1，一次只動一台，LB 健檢自動摘除/回掛
# =============================================================================

# ---------- 1. compose 專案目錄 ----------
# CONVENTIONS.md §4：app compose 專案 = /opt/email-proxy。root:root 0755——
# 目錄本身無機密（機密在 .env，該檔單獨 0600）
- name: 建立 compose 專案目錄
  ansible.builtin.file:
    path: "{{ app_stack_home }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# ---------- 2. mock build context（僅 mock 模式） ----------
- name: 佈署 mock 模擬器 build context（僅 mock 模式）
  when: app_stack_mock
  block:
    - name: 建立 mock build context 目錄
      ansible.builtin.file:
        path: "{{ app_stack_home }}/mock"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # mock 原始碼變更（copy 比對內容）→ notify recreate handler；
    # handler 的 build: always 會先 rebuild 映像再重建容器，新程式碼才會生效
    - name: 複製 mock Dockerfile 與模擬器程式
      ansible.builtin.copy:
        src: "mock/{{ item }}"
        dest: "{{ app_stack_home }}/mock/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - Dockerfile
        - mock_service.py
      notify: restart email-proxy

# ---------- 3. .env（真實 app 的介面契約） ----------
# 含 DB/MQ/KeyDB 密碼與 API key → 0600 + no_log（防 --diff 把機密印上終端）。
# 內容變更必須 recreate 容器：env_file 只在容器「建立」時讀取，
# 跑著的容器不會熱載入 → notify handler
- name: 佈署應用環境檔 .env（機密）
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_stack_home }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: restart email-proxy

# ---------- 4. docker-compose.yml ----------
# 機密都抽到 .env 了，本檔無機密 → 0644、不用 no_log（保留 --diff 可讀性）
- name: 佈署 docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ app_stack_home }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: restart email-proxy

# ---------- 5. PKI 輪替橋接（CONVENTIONS.md §5 契約） ----------
# 本 role 把 {{ pki_dir }} 唯讀掛進容器（.env 的 sslrootcert / KEYDB_TLS_*）。
# 檔案掛載的內容變更 compose 偵測不到；pki_leaf 重簽憑證時會設 host fact
# pki_certs_changed=true，這個橋接 task 據此 notify recreate——
# 讓「10-pki 重簽 → 重跑 50-app」自動使新憑證生效。
# /bin/true 只是掛 notify 的載體，本身無副作用。
- name: 偵測 PKI 憑證輪替並排程容器重建
  ansible.builtin.command: /bin/true
  changed_when: true
  when: pki_certs_changed | default(false)
  notify: restart email-proxy

# ---------- 6. registry 登入（prod、僅在提供帳密時） ----------
# GitLab Container Registry 若未開匿名 pull，各節點要先 docker login。
# 憑證檔落在 root 的 ~/.docker/config.json（docker compose 以 root 跑）。
# no_log：模組參數含密碼，防 -v 詳細輸出外洩
- name: 登入內部 container registry
  community.docker.docker_login:
    registry_url: "{{ registry_host }}"
    username: "{{ app_registry_username }}"
    password: "{{ app_registry_password }}"
  no_log: true
  when:
    - not app_stack_mock
    - app_registry_username is defined
    - app_registry_password is defined

# ---------- 7. compose up ----------
# state=present ≒ docker compose up -d：容器不存在就建、存在就確保運行。
# build 策略：mock 模式用 always——搭配 BuildKit cache，程式沒變就是
# cache 命中（秒級、image id 不變、容器不動 = 冪等）；程式變了本次 up
# 就直接用新映像，簡單可靠。prod 模式沒有 build 段，維持預設 policy。
# 注意它「偵測不到」.env 與掛載憑證的內容變更——那由上面的 notify →
# recreate handler 補上。
- name: 啟動 email_proxy 應用堆疊
  community.docker.docker_compose_v2:
    project_src: "{{ app_stack_home }}"
    state: present
    build: "{{ 'always' if app_stack_mock else 'policy' }}"

# 把排隊中的 recreate 立刻執行掉再做自驗——否則 .env/憑證已變但容器
# 還跑舊設定，下面的健檢會在「舊狀態」上假通過
- name: 立即套用尚未生效的容器變更
  ansible.builtin.meta: flush_handlers

# ---------- 8. 部署自驗：埠就緒 + /health ----------
# 埠即契約（CONVENTIONS.md §3）：8080/2525 必須在節點上聽起來，
# LB 後端與 99-verify 都指著它們。serial: 1 滾動時，這裡擋住
# 「本台還沒 ready 就去動下一台」的連鎖故障
- name: 等待 api/smtp 監聽埠
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ item | int }}"
    timeout: "{{ app_stack_wait_timeout }}"
  loop:
    - "{{ app_http_port }}"
    - "{{ app_smtp_port }}"
  loop_control:
    label: "port {{ item }}"

# 埠開了不代表 handler 就緒（真 app 可能還在跑 migration/暖機），
# 輪詢到 200 才放行；這也是 99-verify 邊界健檢的前哨版
- name: 部署自驗：/health 應回 200
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_http_port }}/health"
    status_code: 200
  register: app_stack_health
  until: app_stack_health.status == 200
  retries: "{{ app_stack_health_retries }}"
  delay: "{{ app_stack_health_delay }}"
