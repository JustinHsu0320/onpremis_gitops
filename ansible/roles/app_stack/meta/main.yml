---
# =============================================================================
# roles/app_stack/meta/main.yml
# =============================================================================
galaxy_info:
  author: email-proxy-infra
  description: >-
    email_proxy 應用堆疊（api / worker / smtp-receiver）compose 佈署：
    host network、NFS 附件掛載、.env 介面契約；prod 拉內部 registry 映像
    （ADR-6），lab（app_stack_mock=true）本地 build 極簡鏈路模擬器。
  license: MIT
  min_ansible_version: "2.16"
  platforms:
    - name: Ubuntu
      versions:
        - all

# 執行順序依賴（Docker/PKI/NFS 掛載/資料層/LB 先就緒）由 site.yml 的
# play 順序保證，不用 meta dependencies 硬綁——硬綁會讓 --tags app
# 單跑時把整條 bootstrap/pki/storage 鏈拖進來。
dependencies: []
