---
# =============================================================================
# roles/monitoring/handlers/main.yml
#
# 為什麼統一 state=restarted 而不是熱載入（kill -HUP）？
#   Prometheus/Alertmanager 支援 SIGHUP reload 設定，但 compose 場景下得繞過
#   compose 抽象去 docker kill -s HUP email-proxy-prometheus；而 Grafana 與
#   Blackbox 的部分設定又只吃重啟。與其兩套機制，不如統一 restart——
#   單一服務中斷 < 2 秒，監控端短暫斷點可接受（被監控的服務本身不受影響），
#   Prometheus TSDB 在 named volume，重啟不掉資料。
#
# 為什麼 restarted 就夠、不像 keydb 要 recreate？
#   設定檔是 bind mount「檔案」：內容變更 compose 偵測不到（它只比對
#   image/容器定義），但容器重啟後服務重讀同一路徑即生效，不需要重建容器。
#   image/environment 層級的變更則由 tasks 的 state=present 自行 reconcile，
#   不經這些 handlers。
#
# handler 名稱格式為契約規定的「restart <service>」小寫（CONVENTIONS.md §8.6），
# 對 ansible-lint 的 name[casing] 加 noqa。
# =============================================================================

- name: restart prometheus  # noqa: name[casing]
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_home }}"
    state: restarted
    services: [prometheus]

- name: restart alertmanager  # noqa: name[casing]
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_home }}"
    state: restarted
    services: [alertmanager]

- name: restart blackbox  # noqa: name[casing]
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_home }}"
    state: restarted
    services: [blackbox]

- name: restart grafana  # noqa: name[casing]
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_home }}"
    state: restarted
    services: [grafana]
