# =============================================================================
# ansible.cfg — 本專案的 Ansible 行為基準
# 對照規劃書 §6.2；每一項設定都附上「為什麼」
# =============================================================================
[defaults]
# 預設打 prod inventory；lab 實驗室用 `-i inventories/lab/hosts.yml` 明確覆寫，
# 避免「以為在打 lab 其實在打 prod」的悲劇（防呆方向：預設值必須是需要最謹慎的那個，
# 你會在操作 lab 時「多打一個參數」，而不是操作 prod 時「忘記打參數」）
inventory = inventories/prod/hosts.yml

roles_path = roles
collections_path = collections

# 開啟 SSH host key 檢查：MITM 防護。新機器第一次連線前，
# 先由 mgmt-01 以 ssh-keyscan 收錄指紋（見 README「新機納管」）
host_key_checking = True

# 不產生 *.retry 檔（歷史包袱，會污染 repo）
retry_files_enabled = False

# 13 台主機的規模，10 個平行 fork 足夠；太高會讓 mgmt-01 的 CPU/SSH 成為瓶頸
forks = 10

# vault 密碼來源（多把鑰匙）：prod 與 lab 各自一把
#  - prod 的 .vault_pass 不進 Git（見 .gitignore），遺失請走 rekey 流程（README）
#  - lab 的密碼檔「刻意」進 Git：lab 機密只是佔位值，方便任何人一鍵起實驗室
vault_identity_list = prod@.vault_pass, lab@lab/vault_pass.txt

# 輸出格式：yaml 比預設的單行 JSON 可讀性好非常多（除錯必備）
# 注意：舊寫法 stdout_callback=yaml（community.general.yaml plugin）已在
# community.general 12.0 移除，新做法是內建 default callback + result_format 選項
stdout_callback = ansible.builtin.default
# 顯示每個 task 的耗時統計，佈署慢的時候第一時間知道卡在哪
callbacks_enabled = ansible.builtin.profile_tasks

[callback_default]
result_format = yaml

# 註：Jinja2「未定義變數即報錯」在新版 ansible-core 已是預設且唯一行為，
# 不需（也不應）再設定舊的 error_on_undefined_vars 選項

[privilege_escalation]
become = True
become_method = sudo
# 靠目標主機 sudoers 的 NOPASSWD（由 VM template/cloud-init 建好），
# 不再走 --ask-become-pass 人工輸入（規劃書 §6 對現況「每次 --ask-pass」的修正）
become_ask_pass = False

[ssh_connection]
# pipelining：省掉每個 task 一來一回的暫存檔動作，速度提升 2-5 倍
# 代價：目標主機 sudoers 不可設 requiretty（Ubuntu 預設就沒有設）
pipelining = True
# ControlPersist：SSH 連線復用，13 台機器跑全站 playbook 的體感差異巨大
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
